name: Deploy to EC2

on:
  push:
    branches:
      - main  # Se ejecutará cada vez que hagas push a la rama main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ejecutar comandos en EC2 vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # Entrar a la carpeta del proyecto
            cd 
            
            # Actualizar el código
            git pull origin main
            
            # Cargar NVM (necesario si instalaste Node con NVM)
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            # Instalar dependencias
            npm install --production
            
            # Reiniciar la aplicación con PM2
            # Si es la primera vez, usa: pm2 start app.js --name "mi-app"
            # Si ya está corriendo, el comando de abajo la actualiza:
            pm2 restart all 
